<div class="mobile-topbar">
  <button class="hamburger" (click)="toggleMenu($event)" aria-label="Abrir menu">
    <i class="fa-solid" [class.fa-bars]="!menuOpen" [class.fa-xmark]="menuOpen"></i>
  </button>
  <span class="mobile-title"> Atalhos Embras </span>
</div>

<div class="menu-backdrop" [class.show]="menuOpen" (click)="closeMenu()"></div>

<div class="lateral_menu" [class.open]="menuOpen">
  <div class="logo">
    <a (click)="reloadPage()">
    <img src="assets/Logo_(white).png">
    </a>
  </div>
  <div class="menu">
    <li class="bot-tit"> Atalhos Embras </li>
    <li class="bot" [class.active]="selectedComponent === 'GoGlobal'" (click)="selectComponent('GoGlobal')"> <i class="fa-solid fa-globe" style="margin-right: 15px; font-size: 18px;"></i> GoGlobal </li>
    <li class="bot has-submenu" [class.open]="openSubmenu === 'egov'" (click)="toggleSubmenu('egov', $event)">
      <i class="fa-solid fa-building-columns" style="margin-right: 15px; font-size: 18px;"></i> E-Gov
      <i class="fa-solid fa-chevron-down submenu-caret"></i>
    </li>
    <ul class="submenu" [class.open]="openSubmenu === 'egov'">
      <li (click)="$event.stopPropagation(); selectComponent('egov', 'egov')" [class.active]="selectedComponent === 'egov'"> E-Gov Prod. </li>
      <li (click)="$event.stopPropagation(); selectComponent('egov_dev', 'egov')" [class.active]="selectedComponent === 'egov_dev'"> E-Gov Homol. </li>
      <li (click)="$event.stopPropagation(); selectComponent('config', 'egov')" [class.active]="selectedComponent === 'config'"> Config E-Gov </li>
    </ul>
    <li class="bot" [class.active]="selectedComponent === 'login-novo'" (click)="selectComponent('login-novo')"> <i class="fa-solid fa-user" style="margin-right: 15px; font-size: 18px;"></i> Config </li>
    <li class="bot" [class.active]="selectedComponent === 'setup'" (click)="selectComponent('setup')"> <i class="fa-solid fa-sliders" style="margin-right: 15px; font-size: 18px;"></i> Setup </li>
    <li class="bot" [class.active]="selectedComponent === 'pessoas'" (click)="selectComponent('pessoas')"> <i class="fa-solid fa-users" style="margin-right: 15px; font-size: 18px;"></i> Pessoas </li>
    <li class="bot" [class.active]="selectedComponent === 'links'" (click)="selectComponent('links')"> <i class="fa-solid fa-link" style="margin-right: 15px; font-size: 18px;"></i> Links Uteis </li>
    <li class="bot" [class.active]="selectedComponent === 'infra'" (click)="selectComponent('infra')"> <i class="fa-solid fa-server" style="margin-right: 15px; font-size: 18px;"></i> Infraestrutura </li>
  </div>
    <p class="versao"> V2.26.07.01 </p>
    <p class="sobre" (click)="selectComponent('SaibaMais')"> Saiba Mais </p>
    <p class="creditos"> Criado por Jonathan William </p>
</div>
