<app-header (componentSelected)="setComponent($event)" (verNotasVersao)="abrirNotasVersao()"></app-header>

<app-notas-versao [visible]="notasVersaoVisivel" (close)="fecharNotasVersao()"></app-notas-versao>

<div class="welcome-box" *ngIf="!currentComponent">
  <div class="welcome-content">
    <img class="welcome-logo" src="assets/Logo_(white).png" alt="Embras">
    <h1 class="welcome-title">Atalhos Embras</h1>
    <p class="welcome-desc">
      Acesso rápido aos sistemas utilizados pelas equipes da Embras.
    </p>
    <div class="welcome-hint">
      <i class="fa-solid fa-hand-pointer"></i>
      <span>Selecione uma opção no menu lateral para visualizar os links</span>
    </div>
    <button class="welcome-notas-btn" (click)="abrirNotasVersao()">
      <i class="fa-solid fa-clock-rotate-left"></i>
      Notas de versão
      <span class="welcome-notas-btn-versao">{{ versaoAtual }}</span>
    </button>
    <div class="welcome-sugestoes">
      <i class="fa-solid fa-envelope"></i>
      <div class="sugestoes-texto">
        <span>Para sugestões de novos links ou melhorias, entre em contato:</span>
        <span class="email-row">
          <span class="email-text">Jonathan.willian&#64;embras.net</span>
          <button class="copy-btn" (click)="copyEmail()" [title]="copied ? 'Copiado!' : 'Copiar e-mail'">
            <i class="fa-solid" [class.fa-copy]="!copied" [class.fa-check]="copied"></i>
          </button>
        </span>
      </div>
    </div>
  </div>
</div>
