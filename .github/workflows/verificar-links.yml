name: Verificar links

# Toda segunda às 7h (Brasília) e sob demanda pela aba Actions.
on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Testar e corrigir links
        run: node scripts/verificar-links.mjs relatorio.md --corrigir

      # Trocas vão num PR para aprovar; a branch é recriada a cada execução a partir da main.
      - name: Abrir ou atualizar o PR das correções
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- src/app/dados && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c correcao-links
          git add src/app/dados
          git commit -m "Correção automática de links"
          git push --force origin correcao-links
          if gh pr view correcao-links --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit correcao-links --body-file correcoes.md
          else
            gh pr create --head correcao-links --base main --title "Correção automática de links" --body-file correcoes.md
          fi

      # Uma issue aberta por vez: atualiza a existente, abre se não houver e fecha quando tudo voltar.
      - name: Abrir, atualizar ou fechar a issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          numero=$(gh issue list --state open --label links-quebrados --json number --jq '.[0].number')
          if [ -s relatorio.md ]; then
            if [ -n "$numero" ]; then
              gh issue edit "$numero" --body-file relatorio.md
            else
              gh label create links-quebrados --color d73a4a --description "Aberta pela verificação semanal de links" --force
              gh issue create --title "Links quebrados" --label links-quebrados --body-file relatorio.md
            fi
          elif [ -n "$numero" ]; then
            gh issue close "$numero" --comment "Todos os links voltaram a abrir."
          fi
